<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Средняя температура датчиков</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Калькулятор средней температуры</h1>
        <textarea id="inputData" rows="4" placeholder="Введите данные датчиков"></textarea>
        <button id="calculateBtn">Вычислить</button>
        <select id="sortOption">
            <option value="id">Сортировать по возрастанию ID</option>
            <option value="temperature">Сортировать по возрастанию средней температуры</option>
        </select>
        <div id="outputData"></div>
    </div>
    <script src="js/scripts.js"></script>
</body>
</html>
